# Minimal Eclipse Mosquitto config for local development.
listener 1883
protocol mqtt

# Anonymous access: fine on a laptop, NEVER in production.  A real deployment
# uses TLS on 8883 plus per-client credentials or certificates.
allow_anonymous true

# Persist queued messages across broker restarts so a restart does not silently
# drop in-flight events.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
